<!doctype html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1200" />
    <title>OG Card</title>

    <link rel="stylesheet" href="./assets/css/fonts.css" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // Palette from vadymklymenko.com
                        ink: "#333",
                        link: "#164e63", // cyan-900, post titles
                    },
                    fontFamily: {
                        heading: ["e-Ukraine Head"],
                        sans: ["e-Ukraine"],
                    },
                },
            },
        };
    </script>
</head>
<body class="m-0 bg-stone-100">

<!--
    OG card, 1200x630

    Layout (card pixels):
      - Text column: x 96..736, y 96..534 (title on top, author at the bottom). Keep SVGs out of it.
      - Avatar: roughly x 860..1200, y 140..630, cropped by the right and bottom edges.
      - Free for decoration: x 740..860 and the top-right corner above the avatar (y < 140).
        The sparkles/dots/circles under "accents" live there too: move or drop any that collide.

    Adding an SVG file to the card (for agents):
      1. Inline it into the main <svg> below, at the "Extra SVGs" slot. Open the file and copy what is
         inside its <svg> tag. Drop <title>, <desc>, and any full-size background <rect> (it would paint
         a white box over the card).
      2. Wrap the copied elements in <g transform="translate(X Y) scale(S)">.
         X Y is where the file's top-left corner lands on the card; S = target width / viewBox width.
         For example, a 512x512 viewBox shown 120px wide at x 760, y 40: translate(760 40) scale(0.234).
         If the viewBox does not start at 0 0, also subtract its origin: translate(X - minX*S  Y - minY*S).
      3. Paint order is document order: the slot sits under the avatar; move the <g> after the avatar
         group to draw on top of it.
      4. Inlined SVGs share one document, so prefix any id="..." and its url(#...)/href="#..." references
         (gradients, clipPaths, masks) to avoid clashes, e.g. id="grad" -> id="icon-grad".
      5. Recolor to the site palette where it fits: #164e63 (cyan-900), #333 (text), #f3d076 (sun yellow),
         #7CC2FF / #4AA8FF / #2E7BE6 (avatar blues), #e7e5e4 (soft circles), card background is stone-100.
      An <img src="./file.svg" class="absolute left-[Xpx] top-[Ypx] w-[Wpx]"> inside #card also works, but
      it can't be recolored and fonts referenced inside the SVG won't load; prefer inlining.
      Render afterwards and look at the PNG: check nothing overlaps the title column or the avatar's face.
-->

<div id="card" class="relative w-[1200px] h-[630px] overflow-hidden bg-stone-100 text-ink">

    <!-- Avatar + accents -->
    <svg class="absolute inset-0" width="1200" height="630" viewBox="0 0 1200 630" aria-hidden="true">
        <defs>
            <!-- 4-point sparkle, unit size -->
            <path id="sparkle" d="M0 -1 C0.12 -0.12 0.12 -0.12 1 0 C0.12 0.12 0.12 0.12 0 1 C-0.12 0.12 -0.12 0.12 -1 0 C-0.12 -0.12 -0.12 -0.12 0 -1 Z" />
        </defs>

        <!-- soft backdrop circles, like the Family card -->
        <circle cx="1120" cy="110" r="96" fill="#e7e5e4" />
        <circle cx="790" cy="590" r="40" fill="#e7e5e4" />

        <!-- accents -->
        <use href="#sparkle" transform="translate(800 150) scale(30)" fill="#f3d076" />
        <use href="#sparkle" transform="translate(1150 300) scale(18)" fill="#f3d076" />
        <use href="#sparkle" transform="translate(830 390) scale(14)" fill="#7CC2FF" />
        <circle cx="900" cy="80" r="9" fill="#f3d076" />
        <circle cx="760" cy="290" r="7" fill="#7CC2FF" />

        <!-- Extra SVGs: inline them here as <g transform="translate(X Y) scale(S)">…</g>, see the guide at the top -->

        <!-- avatar (02-tonal-no-beard.svg), cropped off the bottom-right corner -->
        <g transform="translate(660 -30) scale(1.7)">
            <g transform="rotate(-7 256 280)">
                <rect x="142" y="166" width="248" height="248" rx="72" fill="#4AA8FF" />
                <rect x="124" y="150" width="248" height="248" rx="72" fill="#7CC2FF" />
                <path d="M124 240 C120 196 132 158 168 150 C178 118 216 104 246 118 C266 94 312 98 324 126 C358 128 382 160 376 200 C380 214 378 228 372 240 C358 214 332 202 302 204 C274 206 250 216 234 232 C212 218 168 216 124 240 Z" fill="#2E7BE6" />
                <ellipse cx="212" cy="276" rx="16" ry="21" fill="#2B2B2B" />
                <ellipse cx="288" cy="276" rx="16" ry="21" fill="#2B2B2B" />
                <!-- eye highlights -->
                <ellipse cx="206" cy="267" rx="4.5" ry="7" transform="rotate(18 206 267)" fill="#FFFFFF" />
                <ellipse cx="282" cy="267" rx="4.5" ry="7" transform="rotate(18 282 267)" fill="#FFFFFF" />
            </g>
        </g>
    </svg>

    <div class="absolute left-24 top-24 bottom-24 w-[640px] flex flex-col">

    <!-- Title (shrinks to fit, see script below) -->
    <h1 id="title" class="flex-1 min-h-0 overflow-hidden font-heading font-normal text-[80px] leading-[1.1] text-link">
        Хакатонний слоп
    </h1>

    <!-- Author -->
    <div class="shrink-0 mt-10 flex items-center gap-4">
        <img src="./assets/avatar.png" alt="" class="w-14 h-14 rounded-full object-cover" />
        <div class="font-sans font-medium text-[32px] leading-none text-ink">
            Вадим Клименко
        </div>
    </div>

    </div>

</div>

<script>
    // Step the title down from 80px until it fits its box (long titles, long words)
    function fitTitle() {
        const title = document.getElementById("title");
        let size = 80;
        title.style.fontSize = size + "px";
        while ((title.scrollHeight > title.clientHeight || title.scrollWidth > title.clientWidth) && size > 36) {
            size -= 2;
            title.style.fontSize = size + "px";
        }
    }
    window.addEventListener("load", () => document.fonts.ready.then(fitTitle));
</script>

</body>
</html>
